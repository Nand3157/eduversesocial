# Supabase CLI configuration.
# Docs: https://supabase.com/docs/reference/cli/config
#
# Workflow:
#   1. npm run db:login        # authenticate the CLI once
#   2. npm run db:link         # link this project to your hosted Supabase project
#   3. npm run db:new -- <name># create a new timestamped migration
#   4. npm run db:migrate      # apply pending migrations to the linked project
#   5. npm run db:status       # show applied vs pending migrations
#
# For local development with Docker instead of the hosted project:
#   npx supabase start        # boots local Postgres/Auth/Studio
#   npx supabase db reset     # applies all migrations to the local DB

project_id = "socialpulse"

[api]
enabled = true
port = 54321

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
